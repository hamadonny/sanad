# Local development infrastructure. Usage: `pnpm infra:up` / `pnpm infra:down`.
# Host ports are 5433 / 6380 / 1026 / 8026 (not the defaults) so Sanad does not collide with
# other projects or a Postgres/Redis installed directly on the computer.
name: sanad

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sanad
      POSTGRES_PASSWORD: sanad
      POSTGRES_DB: sanad
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sanad -d sanad']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1026:1025' # SMTP
      - '8026:8025' # Web UI → http://localhost:8026

volumes:
  postgres-data:
  redis-data:
